name: Verifier les exports
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifier le catalogue et les fichiers
        run: python scripts/verifier_exports.py
